name: Offline retrieval checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests examples
          python -m unittest discover -s tests -v
      - name: Reproduce frozen retrieval report
        env:
          PYTHONPATH: src
        run: |
          python -m rag_foundation ingest
          python -m rag_foundation evaluate --output build/evaluation.json
          cmp results/day1-evaluation.json build/evaluation.json
          python -m rag_foundation query 'test client live server' -k 3 > build/query-output.json
          cmp examples/query-output.json build/query-output.json
          python examples/evaluate_service.py > build/service-development.json
          cmp results/service-development.json build/service-development.json
