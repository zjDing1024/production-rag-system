name: Offline retrieval checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests examples
          python -m unittest discover -s tests -v
      - name: Reproduce frozen retrieval report
        env:
          PYTHONPATH: src
        run: |
          python -m rag_foundation ingest
          python -m rag_foundation evaluate --output build/evaluation.json
          cmp results/day1-evaluation.json build/evaluation.json
          python -m rag_foundation query 'test client live server' -k 3 > build/query-output.json
          cmp examples/query-output.json build/query-output.json
          python examples/evaluate_service.py > build/service-development.json
          cmp results/service-development.json build/service-development.json
          python -m rag_foundation.challenge > build/bilingual-challenge-v1.json
          cmp results/bilingual-challenge-v1.json build/bilingual-challenge-v1.json
          python -m rag_foundation.challenge_audit > build/bilingual-challenge-v1-audit.json
          cmp results/bilingual-challenge-v1-audit.json build/bilingual-challenge-v1-audit.json
      - name: Verify recorded generation evidence without a model
        run: |
          python experiments/bilingual-generation-v1/audit_record.py > build/bilingual-generation-v1-summary.json
          cmp experiments/bilingual-generation-v1/summary.json build/bilingual-generation-v1-summary.json
      - name: Verify recorded evidence-gate comparison without a model
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s experiments/evidence-sufficiency-v1 -p test_audit.py -v
          python experiments/evidence-sufficiency-v1/audit_record.py > build/evidence-sufficiency-v1-audit.json
          cmp experiments/evidence-sufficiency-v1/summary.json build/evidence-sufficiency-v1-audit.json
      - name: Verify bounded span comparison without a model
        run: |
          python -m unittest discover -s experiments/numbered-spans-v1 -p 'test_*.py' -v
          python experiments/numbered-spans-v1/audit_record.py > build/numbered-spans-v1-summary.json
          cmp experiments/numbered-spans-v1/summary.json build/numbered-spans-v1-summary.json
      - name: Verify matched evidence comparison without a model
        run: |
          python -m unittest discover -s experiments/matched-evidence-v1 -p 'test_*.py' -v
          python experiments/matched-evidence-v1/audit_record.py --check
      - name: Verify typed scope comparison without a model
        run: |
          python -m unittest discover -s experiments/typed-scope-v1 -p 'test_*.py' -v
          python experiments/typed-scope-v1/audit_record.py --check
      - name: Verify indexed scope integration without a model
        run: |
          python -m unittest discover -s experiments/indexed-scope-v1 -p 'test_*.py' -v
          python experiments/indexed-scope-v1/audit_record.py --check
      - name: Verify two-source real generation evidence offline
        run: |
          python -m unittest discover -s experiments/source-transfer-v1 -p 'test_*.py' -v
          python experiments/source-transfer-v1/audit_record.py --check
      - name: Reproduce version binding and catalog controls offline
        run: |
          python experiments/version-binding-v1/replay.py --check
          python experiments/version-binding-v1/audit_live.py --check
      - name: Verify Cargo resolver scope pilot offline
        run: python experiments/cargo-resolver-v1/audit.py --check
